# Every device or fault parameter in RadSlice lives in this file.
#
# Tiers:
#   A  published measurement; `source` must name it (paper, table/figure).
#   B  calibrated model; `source` must name what it was calibrated against.
#   C  hypothetical. The default. A simulation using a tier-C value is a
#      what-if, never a measurement.
#
# Sourced values (tiers A and B) come from one paper: Ao, Zhou et al., "A RISC-V 32-bit
# microprocessor based on two-dimensional semiconductors", Nature 640, 654-661 (2025),
# doi:10.1038/s41586-025-08759-9 - its main text (pages 657 and 659) and Supplementary
# Fig. 7. The paper reports no radiation or upset data and no whole-processor yield.
# Everything else is tier C.

[meta]
schema = 1

# --- Yield ---------------------------------------------------------------

[yield.measured_8bit_shift_register]
value = 0.71
tier = "A"
unit = "probability"
source = "Ao, Zhou et al., Nature 640, 654-661 (2025), main text p. 659 and Supplementary Fig. 7(c)"
note = """Main text: "The yield of 8-bit registers, each with 144 transistors, reached 71% at the
wafer scale." (The supplementary caption says "can reach 71%".) 224 registers on a 4-inch
wafer. This is a measurement of an 8-bit MoS2 shift register, the building block of the
chip's own 32-bit register, not of a random-access register-file slice."""

[yield.measured_8bit_shift_register_from_map]
value = 0.7366
tier = "A"
unit = "probability"
source = "Supplementary Fig. 7(c), the wafer map, transcribed by scripts/si_fig7_extract.py into results/si_fig7_wafer_map.txt"
note = """Counting the map gives 165 working of 224 registers (59 failed), which is 73.7%, not
exactly the 71% in the text. The paper does not explain the difference; both are kept.
The same map shows no clustering of failures; see docs/results.md."""

[yield.measured_64bit_register]
value = 0.07
tier = "A"
unit = "probability"
source = "Ao, Zhou et al., Nature 640, 654-661 (2025), main text p. 659"
note = """"approximately 7% for a 64-bit register with 1,152 transistors". The authors round
it; the independent scaling of the 8-bit figure gives 0.71 ** 8 = 0.0646. 1,152 is 8 times
144. How the 64-bit yield was measured is not stated in the text (the supplementary wafer map
has 28 matrices of 8 parallel 8-bit registers, 2 of which had no failed register)."""

[yield.measured_transistor]
value = 0.9992
tier = "A"
unit = "probability"
source = "Ao, Zhou et al., Nature 640, 654-661 (2025), main text p. 657"
note = """"The overall transistor yield reached 99.92%": three batches of wafers, each with
7,000 transistors, 800 randomly selected for testing. Isolated-device yield; it does not
predict register yield (see yield.implied_per_transistor)."""

[yield.measured_inverter]
value = 0.9977
tier = "A"
unit = "probability"
source = "Ao, Zhou et al., Nature 640, 654-661 (2025), main text p. 657"
note = """"898 out of 900 inverters worked correctly with a yield of 99.77%": a 30 x 30
array in the 6 mm x 6 mm region of the chip, overall noise tolerance 0.5 V. Two failures in
900 (95% interval 0.06% to 0.81% failing)."""

[yield.p_slice_good]
value = 0.71
tier = "B"
unit = "probability"
source = "Calibrated to the measured 8-bit shift-register yield above (Nature 640, 654-661, p. 659); the lower of the two readings is used"
note = """Probability that one 8-bit register slice is defect-free. Calibrated, not measured,
because the modelled slice is assumed to yield like the measured 8-bit shift register of 144
transistors: the same circuit block as the chip's own register, but not a random-access
register-file slice with read and write ports. The fabricated chip is a 32-bit bit-serial
design built on SERV with a 1-bit ALU, not the 64-bit core modelled here."""

[yield.implied_per_transistor]
value = 0.99762
tier = "B"
unit = "probability"
source = "Derived: 0.71 over 144 transistors; the 64-bit figure (~7% over 1,152) gives 0.99769"
note = """Per-transistor yield that independent failures would need to produce the register
yields: 0.71 ** (1/144). The two register yields (8-bit and 64-bit) imply the same value, so
yield falls with transistor count as independent failures predict. It is about three times
worse (0.24% failing) than the isolated-transistor test (0.08%) and twice the inverter test
(0.11%), so register yield is not predicted by device-level yield."""

[yield.slice_width_bits]
value = 8
tier = "C"
unit = "bits"
note = "Granularity of a physical register slice (a byte slice). A modelling choice."

# --- Register file geometry ----------------------------------------------

[regfile.num_regs]
value = 32
tier = "C"
unit = "registers"
note = """Architectural count. x0 is hardwired to zero in the golden model, so a
physical file needs only 31 storage words; the yield tables use 32 x 8 = 256
slices as stated in the project brief. This overstates storage slightly."""

[regfile.width_bits]
value = 64
tier = "C"
unit = "bits"
note = "RV64."

[regfile.spare_slices]
value = 0
tier = "C"
unit = "slices"
note = "Shared spare pool size. Swept by the yield model; 0 is the baseline."

# --- ALU -----------------------------------------------------------------

[alu.slice_width_bits]
value = 16
tier = "C"
unit = "bits"
note = "K. Swept over 8, 16, 32. Each ALU op takes 64/K beats."

# --- Transient faults (used from M4) -------------------------------------

[fault.seu_per_bit_per_cycle]
value = 1.0e-9
tier = "C"
unit = "1/(bit*cycle)"
note = """Placeholder so that injection code has something to sweep. NOT a
measurement of MoS2 or of any environment. Results must be reported as a
function of this rate, not at this value."""

# --- Cycle model (used from M2) ------------------------------------------
# These define the analytical cost model. They are modelling choices, not
# device properties, and every overhead figure is reported as a function of them.

[cycles.base_per_instruction]
value = 1
tier = "C"
unit = "beats"
note = """Cost of everything outside the integer ALU: fetch, decode, memory access,
the plain PC adders, and M/A/F/D. scripts/m2_cycles.py reports 1, 2 and 4. A larger
value dilutes the ALU overhead, so the overhead at 1 is the pessimistic end."""

[cycles.beats_per_slice_op]
value = 1
tier = "C"
unit = "beats"
note = "One beat per slice-unit operation, independent of K. A real K-bit adder is slower for larger K; this ignores that."

[cycles.w_form_sign_extension_beats]
value = 0
tier = "C"
unit = "beats"
note = """Sign-extending a W-form result into the upper slices is done by the
write-back path and costs no ALU beat. If it costs one, every W op gets +1."""

[cycles.regfile_port_matches_alu_slice]
value = true
tier = "C"
unit = "bool"
note = """Assumes operand read and result write stream at the ALU's slice width, so
register-file access is hidden behind the ALU beats. For K = 16 or 32 this needs a
wider-than-byte read/write port into the byte-slice register file."""

# --- Permanent-defect model (used from M3) -------------------------------

[defects.fault_model]
value = "one stuck output bit or stuck carry per defective slice"
tier = "C"
unit = "model"
note = """The simplest fault a test can be wrong about. Real MoS2 defects are richer
(and may cluster); nothing here is calibrated to any device."""

[defects.alu_unit_good_probability]
value = "p_slice_good ** (K / 8)"
tier = "C"
unit = "probability"
note = """An ALU slice of K bits has the same defect density per bit as an 8-bit
register slice. The 0.71 figure is for a register slice, not for logic; applying it
to ALU logic is an assumption. In transistor terms it assumes an 8-bit ALU slice has about
the same 144 transistors as the measured 8-bit shift register; the real count is unknown.
The paper's two register yields (144 and 1,152 transistors) do scale as p ** (transistors / 144),
which supports area-proportional scaling for register-like circuits."""

[defects.activation]
value = 1.0
tier = "C"
unit = "probability"
note = """Probability a defect shows on one access. 1.0 = hard defect (always). Values
below 1 model weak/intermittent defects and are swept in the weak-defect experiment."""

[selftest.rounds]
value = 1
tier = "C"
unit = "rounds"
note = """Boot self-test repetitions. One round is enough for hard defects and far from
enough for weak ones (see docs/results.md, M3). Test time and its cost are not modelled."""

[spares.crossbar]
value = "ideal: any spare serves any slice"
tier = "C"
unit = "model"
note = """The remap table, its multiplexers and the self-test logic are assumed
fault-free and free. Every yield figure is therefore an upper bound."""

# --- Transient-fault campaigns (used from M4) ----------------------------
# Nothing below is a measurement of MoS2 or of any radiation environment. The rates are
# swept, and every result is reported as a function of them.

[fault.rf_upset_sweep]
value = "1e-9, 3e-9, 1e-8"
tier = "C"
unit = "1/(bit*cycle)"
note = """Register-file upset rates swept in M4 (per exposed stored bit, per model cycle).
Chosen so the unprotected core sees roughly 0.3 to 4 upsets per workload run; chosen
for statistical usefulness, not because any environment produces them."""

[fault.alu_upset_sweep]
value = "5e-7, 2e-6, 8e-6"
tier = "C"
unit = "1/(output bit*beat)"
note = """ALU upset rates swept in M4: each slice-unit output bit (K data bits and the
carry) is flipped with this probability per beat, at most one flip per operation."""

[fault.model]
value = "independent single-bit flips, Poisson in time"
tier = "C"
unit = "model"
note = """Register file: one Poisson process over every exposed stored bit (data bits of
x1..x31 in every copy, and the parity bit where the scheme has one). ALU: independent
per slice-unit call. No multi-bit upsets, no correlation between copies, no upsets in
memory, CSRs, the control FSM, or in the vote/compare/parity logic."""

[protection.schemes]
value = "rf: none | parity | parity-dup | tmr;  alu: none | dwc | tmr;  scrub period"
tier = "C"
unit = "scheme"
note = """Parity is detect-only (fail-stop). Parity-dup repairs from the clean copy. TMR is
a bitwise majority. DWC runs an ALU op twice and a third time on mismatch; ALU TMR runs
it three times. The vote, compare and parity logic is fault-free and takes no cycles."""

[protection.scrub_period]
value = 32
tier = "C"
unit = "instructions per scrubbed word"
note = "One register word is scrubbed every 32 retired instructions, round-robin; a scrub read costs 1 beat."

[protection.control_fsm]
value = "triplicated with a voter, not fault-injected"
tier = "C"
unit = "model"
note = """The control FSM is modelled as triplicated and voted but is not injected, as
scoped for v0. Its area and any voter delay are not counted anywhere."""

[run.hang_budget]
value = "3 x golden instructions + 1000"
tier = "C"
unit = "instructions"
note = "A run that has not finished within this many instructions is a hang."

# --- Clustered defects (used by the G9 study) ----------------------------

[yield.cluster_alpha_min_matrix_scale]
value = 9.37
tier = "B"
unit = "gamma shape"
source = "Derived from the Supplementary Fig. 7 wafer map (28 matrices of 8 registers) by a one-sided likelihood-ratio test, python/radslice/cluster_model.py"
note = """The strongest clustering (smallest gamma shape alpha) that the wafer map does not reject at
about 95%: failures inside an 8-register matrix have pairwise correlation of at most about 0.03.
It constrains differences BETWEEN matrices only. A defect rate common to every matrix on the wafer
(wafer-, batch- or die-level variation) leaves no difference between matrices, so it is NOT constrained
by one wafer."""

[defects.clustering_model]
value = "gamma-mixed block multipliers; marginal slice yield fixed at p"
tier = "C"
unit = "model"
note = """Each block of slices draws a defect-rate multiplier ~ Gamma(alpha, mean 1); given it, slices
fail independently with probability 1 - exp(-lam * m), with lam chosen so the marginal slice yield is
exactly p. alpha small = strong clustering; alpha large = independence. Blocks are independent. No
spatial gradient across the wafer, and no clustering of transient upsets."""

[defects.cluster_alpha_sweep]
value = "independent, 50, 20, 9.4, 4, 1"
tier = "C"
unit = "gamma shape"
note = """Clustering strengths swept. 50 down to 9.4 span what the wafer map allows at matrix scale;
4 and 1 are stress tests beyond what it allows there, and are hypothetical."""

[defects.cluster_scale]
value = "blocks of 32 slices, or die-level (one rate for the whole register file)"
tier = "C"
unit = "slices"
note = """Scales at which a defect-rate multiplier is shared. Die-level is the one the wafer map
cannot test and the one that matters most for the spare count."""

[spares.regions]
value = "1, 2, 4, 8, 16, 32 regions"
tier = "C"
unit = "regions"
note = """Reach of a spare: 1 is the ideal pool (any spare serves any slice); n restricts each spare
to 1/n of the register file; 32 is one region per register (private spares)."""

[cost.rf_block_transistors]
value = 144
tier = "A"
unit = "transistors"
source = "Ao, Zhou et al., Nature 640, 654-661 (2025), main text p. 659"
note = """An 8-bit register block, the byte slice of this project's register file."""

[cost.adder_bit_transistors]
value = 27
tier = "A"
unit = "transistors"
source = "Ao, Zhou et al., Nature 640, 654-661 (2025), Extended Data Fig. 5"
note = """A 1-bit controlled adder with its control logic. An ALU that also shifts, compares and does
logic is bigger than an adder; that is the tier-C factor cost.alu_factor."""

[cost.selection_module_transistors]
value = 27
tier = "A"
unit = "transistors"
source = "Ao, Zhou et al., Nature 640, 654-661 (2025), Extended Data Fig. 5"
note = """A four-input selection module."""

[cost.mux2_transistors]
value = 9
tier = "B"
unit = "transistors"
source = "Derived: the 27-transistor four-input selection module is three 2-input selections"
note = """Cost of one 2-input multiplexer; an m-input multiplexer is taken as 9(m-1). A different
circuit style would change it; the study varies it from 0.5x to 4x."""

[cost.store_bit_transistors]
value = 18
tier = "B"
unit = "transistors"
source = "Derived: 144 transistors per 8-bit register block, divided by 8"
note = """Used for the storage part of one tag bit in the spare array."""

[cost.area_proxy]
value = "transistor count"
tier = "C"
unit = "model"
note = """Silicon area is taken as proportional to transistor count. Wiring, vias and layout are not
counted; a crossbar is wire-dominated, so this probably understates routing cost."""

[cost.routing_topology]
value = "tagged spare array (default); per-position multiplexers (upper bound)"
tier = "C"
unit = "model"
note = """Tagged: spares sit in a side array, each holding a tag of the slice it replaces, compared
on every access, and the output lane multiplexers gain one input per reaching spare.
Per-position: every slice position has its own multiplexer over the spares in reach."""

[cost.ports]
value = "2 read ports, 1 write port"
tier = "C"
unit = "ports"
note = """Ports that need steering or tag comparison. Swept 1 to 3 read ports."""

[cost.tag_compare_transistors]
value = 9
tier = "C"
unit = "transistors per tag bit per port"
note = """One XNOR-class gate. Swept 0 to 27."""

[cost.alu_factor]
value = 1
tier = "C"
unit = "x adder"
note = """ALU unit silicon as a multiple of an adder of the same width. Swept 1, 4, 16."""

[cost.other_silicon]
value = 0
tier = "C"
unit = "transistors"
note = """Silicon outside the register file and the ALU (control, decode, PC adders, memory interface);
unaffected by sparing. Swept 0, 6,000, 60,000."""

[cost.alu_organisation]
value = "replicated (one unit per position, as in M2/M3) and single (one K-bit unit reused)"
tier = "C"
unit = "model"
note = """Which one the fabricated chip's wording implies is ambiguous for K > 1; the paper's chip is
K = 1 and reuses a single 1-bit ALU. Both are costed."""
