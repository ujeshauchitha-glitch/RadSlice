# Every device or fault parameter in RadSlice lives in this file.
#
# Tiers:
#   A  published measurement; `source` must name it (paper, table/figure).
#   B  calibrated model; `source` must name what it was calibrated against.
#   C  hypothetical. The default. A simulation using a tier-C value is a
#      what-if, never a measurement.
#
# Sourced values (tiers A and B) come from one paper: Ao, Zhou et al., "A RISC-V 32-bit
# microprocessor based on two-dimensional semiconductors", Nature 640, 654-661 (2025),
# doi:10.1038/s41586-025-08759-9 - specifically Supplementary Fig. 7, read from its
# Supplementary Information. The main text of the paper was behind a paywall and has NOT
# been read, so any yield claim made only there is unchecked. Everything else is tier C.

[meta]
schema = 1

# --- Yield ---------------------------------------------------------------

[yield.measured_8bit_shift_register]
value = 0.71
tier = "A"
unit = "probability"
source = "Ao, Zhou et al., Nature 640, 654-661 (2025), Supplementary Information, Supplementary Fig. 7(c) caption"
note = """The caption says the yield of 8-bit shift registers, each of 144 transistors, "can
reach 71% on the wafer" (224 registers on a 4-inch wafer). "Can reach" may mean a best
case. This is a measurement of an 8-bit MoS2 shift register, not of a register-file slice."""

[yield.measured_8bit_shift_register_from_map]
value = 0.7366
tier = "A"
unit = "probability"
source = "Same figure, panel (c): the wafer map, transcribed by scripts/si_fig7_extract.py into results/si_fig7_wafer_map.txt"
note = """Counting the map gives 165 working of 224 registers (59 failed), which is 73.7%, not
exactly the caption's 71%. The SI does not say which definition the caption uses; both are
kept. The same map shows no clustering of failures and 2 of 28 64-bit matrices with no
failed register (7.1%); see docs/results.md."""

[yield.p_slice_good]
value = 0.71
tier = "B"
unit = "probability"
source = "Calibrated to the measured 8-bit shift-register yield above (Nature 640, 654-661, Supp. Fig. 7(c)); the lower of the two readings is used"
note = """Probability that one 8-bit register slice is defect-free. The assumption behind
calling this calibrated rather than measured: a byte slice of the modelled register file
yields like the measured 8-bit shift register of 144 transistors. They are different
circuits (a shift register is a flip-flop chain; an addressable register-file slice has
read and write ports), and the fabricated chip is a 32-bit bit-serial design, not the
64-bit core modelled here."""

[yield.implied_per_transistor]
value = 0.99762
tier = "B"
unit = "probability"
source = "Derived from 0.71 over 144 transistors (Supp. Fig. 7(c)); 0.99788 from the map count"
note = """Per-transistor yield implied by the register measurement if transistors fail
independently: 0.71 ** (1/144). Useful for sizing other circuits by transistor count. It is
not stated in the paper's supplementary information, and a secondary report of a processor
yield above 99.9% (not verified, main text unread) is not the same quantity."""

[yield.slice_width_bits]
value = 8
tier = "C"
unit = "bits"
note = "Granularity of a physical register slice (a byte slice). A modelling choice."

# --- Register file geometry ----------------------------------------------

[regfile.num_regs]
value = 32
tier = "C"
unit = "registers"
note = """Architectural count. x0 is hardwired to zero in the golden model, so a
physical file needs only 31 storage words; the yield tables use 32 x 8 = 256
slices as stated in the project brief. This overstates storage slightly."""

[regfile.width_bits]
value = 64
tier = "C"
unit = "bits"
note = "RV64."

[regfile.spare_slices]
value = 0
tier = "C"
unit = "slices"
note = "Shared spare pool size. Swept by the yield model; 0 is the baseline."

# --- ALU -----------------------------------------------------------------

[alu.slice_width_bits]
value = 16
tier = "C"
unit = "bits"
note = "K. Swept over 8, 16, 32. Each ALU op takes 64/K beats."

# --- Transient faults (used from M4) -------------------------------------

[fault.seu_per_bit_per_cycle]
value = 1.0e-9
tier = "C"
unit = "1/(bit*cycle)"
note = """Placeholder so that injection code has something to sweep. NOT a
measurement of MoS2 or of any environment. Results must be reported as a
function of this rate, not at this value."""

# --- Cycle model (used from M2) ------------------------------------------
# These define the analytical cost model. They are modelling choices, not
# device properties, and every overhead figure is reported as a function of them.

[cycles.base_per_instruction]
value = 1
tier = "C"
unit = "beats"
note = """Cost of everything outside the integer ALU: fetch, decode, memory access,
the plain PC adders, and M/A/F/D. scripts/m2_cycles.py reports 1, 2 and 4. A larger
value dilutes the ALU overhead, so the overhead at 1 is the pessimistic end."""

[cycles.beats_per_slice_op]
value = 1
tier = "C"
unit = "beats"
note = "One beat per slice-unit operation, independent of K. A real K-bit adder is slower for larger K; this ignores that."

[cycles.w_form_sign_extension_beats]
value = 0
tier = "C"
unit = "beats"
note = """Sign-extending a W-form result into the upper slices is done by the
write-back path and costs no ALU beat. If it costs one, every W op gets +1."""

[cycles.regfile_port_matches_alu_slice]
value = true
tier = "C"
unit = "bool"
note = """Assumes operand read and result write stream at the ALU's slice width, so
register-file access is hidden behind the ALU beats. For K = 16 or 32 this needs a
wider-than-byte read/write port into the byte-slice register file."""

# --- Permanent-defect model (used from M3) -------------------------------

[defects.fault_model]
value = "one stuck output bit or stuck carry per defective slice"
tier = "C"
unit = "model"
note = """The simplest fault a test can be wrong about. Real MoS2 defects are richer
(and may cluster); nothing here is calibrated to any device."""

[defects.alu_unit_good_probability]
value = "p_slice_good ** (K / 8)"
tier = "C"
unit = "probability"
note = """An ALU slice of K bits has the same defect density per bit as an 8-bit
register slice. The 0.71 figure is for a register slice, not for logic; applying it
to ALU logic is an assumption. In transistor terms it assumes an 8-bit ALU slice has about
the same 144 transistors as the measured 8-bit shift register; the real count is unknown."""

[defects.activation]
value = 1.0
tier = "C"
unit = "probability"
note = """Probability a defect shows on one access. 1.0 = hard defect (always). Values
below 1 model weak/intermittent defects and are swept in the weak-defect experiment."""

[selftest.rounds]
value = 1
tier = "C"
unit = "rounds"
note = """Boot self-test repetitions. One round is enough for hard defects and far from
enough for weak ones (see docs/results.md, M3). Test time and its cost are not modelled."""

[spares.crossbar]
value = "ideal: any spare serves any slice"
tier = "C"
unit = "model"
note = """The remap table, its multiplexers and the self-test logic are assumed
fault-free and free. Every yield figure is therefore an upper bound."""

# --- Transient-fault campaigns (used from M4) ----------------------------
# Nothing below is a measurement of MoS2 or of any radiation environment. The rates are
# swept, and every result is reported as a function of them.

[fault.rf_upset_sweep]
value = "1e-9, 3e-9, 1e-8"
tier = "C"
unit = "1/(bit*cycle)"
note = """Register-file upset rates swept in M4 (per exposed stored bit, per model cycle).
Chosen so the unprotected core sees roughly 0.3 to 4 upsets per workload run; chosen
for statistical usefulness, not because any environment produces them."""

[fault.alu_upset_sweep]
value = "5e-7, 2e-6, 8e-6"
tier = "C"
unit = "1/(output bit*beat)"
note = """ALU upset rates swept in M4: each slice-unit output bit (K data bits and the
carry) is flipped with this probability per beat, at most one flip per operation."""

[fault.model]
value = "independent single-bit flips, Poisson in time"
tier = "C"
unit = "model"
note = """Register file: one Poisson process over every exposed stored bit (data bits of
x1..x31 in every copy, and the parity bit where the scheme has one). ALU: independent
per slice-unit call. No multi-bit upsets, no correlation between copies, no upsets in
memory, CSRs, the control FSM, or in the vote/compare/parity logic."""

[protection.schemes]
value = "rf: none | parity | parity-dup | tmr;  alu: none | dwc | tmr;  scrub period"
tier = "C"
unit = "scheme"
note = """Parity is detect-only (fail-stop). Parity-dup repairs from the clean copy. TMR is
a bitwise majority. DWC runs an ALU op twice and a third time on mismatch; ALU TMR runs
it three times. The vote, compare and parity logic is fault-free and takes no cycles."""

[protection.scrub_period]
value = 32
tier = "C"
unit = "instructions per scrubbed word"
note = "One register word is scrubbed every 32 retired instructions, round-robin; a scrub read costs 1 beat."

[protection.control_fsm]
value = "triplicated with a voter, not fault-injected"
tier = "C"
unit = "model"
note = """The control FSM is modelled as triplicated and voted but is not injected, as
scoped for v0. Its area and any voter delay are not counted anywhere."""

[run.hang_budget]
value = "3 x golden instructions + 1000"
tier = "C"
unit = "instructions"
note = "A run that has not finished within this many instructions is a hang."
