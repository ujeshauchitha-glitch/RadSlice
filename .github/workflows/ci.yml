name: ci
on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: bash scripts/run-python-tests.sh

  golden-model-builds:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - run: cmake -S . -B build
      - run: cmake --build build -j
      - run: ctest --test-dir build -R radslice_ --output-on-failure

  hw-riscv-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - run: sudo apt-get update && sudo apt-get install -y gcc-riscv64-unknown-elf
      - run: cmake -S . -B build && cmake --build build -j --target radslice_run
      - run: |
          for k in 8 16 32; do
            bash scripts/run-hw-riscv-tests.sh $k rv64ui rv64mi
          done
